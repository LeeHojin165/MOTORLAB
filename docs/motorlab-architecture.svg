<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Pretendard Variable, Pretendard, 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6e76"/>
    </marker>
    <style>
      .t { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .s { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 12px; text-anchor: middle; }
      .lbl { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 12px; fill: #4a4d55; }
      .inT { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 13px; font-weight: 600; text-anchor: middle; fill: #1f5c47; }
      .inS { font-size: 11px; text-anchor: middle; fill: #4f7d6c; }
      .line { stroke: #6b6e76; stroke-width: 1.4; fill: none; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- 사용자 -->
  <rect x="40" y="50" width="220" height="70" rx="10" fill="#EEEDFE" stroke="#7B6FD6" stroke-width="1.5"/>
  <text x="150" y="80" class="t" fill="#3C2F9E">사용자</text>
  <text x="150" y="102" class="s" fill="#5A4FC0">웹 브라우저 · 차량 질문</text>
  <path d="M150 120 V160" class="line" marker-end="url(#arr)"/>

  <!-- 프론트엔드 -->
  <rect x="40" y="162" width="220" height="92" rx="10" fill="#FCEDE8" stroke="#C8664A" stroke-width="1.5"/>
  <text x="150" y="192" class="t" fill="#8E3B22">프론트엔드</text>
  <text x="150" y="214" class="s" fill="#B0563A">HTML · CSS · JavaScript</text>
  <text x="150" y="234" class="s" fill="#B0563A">index.html · chat.html</text>

  <!-- 프론트 → 백엔드 -->
  <path d="M260 208 H338" class="line" marker-end="url(#arr)"/>
  <text x="270" y="198" class="lbl">REST · SSE</text>

  <!-- 백엔드 -->
  <rect x="340" y="50" width="470" height="350" rx="12" fill="#E5F4EE" stroke="#3E9C7A" stroke-width="1.5"/>
  <text x="575" y="82" class="t" fill="#1F5C47">백엔드 · FastAPI</text>
  <text x="575" y="104" class="s" fill="#3E9C7A">uvicorn · localhost:8000 · 화면도 함께 제공</text>

  <rect x="362" y="124" width="205" height="122" rx="8" fill="#ffffff" stroke="#7DBFA6"/>
  <text x="464" y="158" class="inT">collect</text>
  <text x="464" y="182" class="inS">프롬프트 1 검색어 추출</text>
  <text x="464" y="200" class="inS">프롬프트 2 후보 선별</text>
  <text x="464" y="218" class="inS">위키 본문 수집 · 캐시</text>

  <rect x="583" y="124" width="205" height="122" rx="8" fill="#ffffff" stroke="#7DBFA6"/>
  <text x="685" y="158" class="inT">rag · LangGraph</text>
  <text x="685" y="182" class="inS">retrieve → generate</text>
  <text x="685" y="200" class="inS">메타 [근거 1] 고정 + 유사도/MMR</text>
  <text x="685" y="218" class="inS">프롬프트 3 · 인용 근거만 표시</text>

  <rect x="362" y="260" width="205" height="122" rx="8" fill="#ffffff" stroke="#7DBFA6"/>
  <text x="464" y="294" class="inT">store</text>
  <text x="464" y="318" class="inS">청킹 1,000자 / 중복 200자</text>
  <text x="464" y="336" class="inS">청크 ID {차량}:{문서}:{순번}</text>
  <text x="464" y="354" class="inS">재색인해도 개수 불변</text>

  <rect x="583" y="260" width="205" height="122" rx="8" fill="#ffffff" stroke="#7DBFA6"/>
  <text x="685" y="294" class="inT">services</text>
  <text x="685" y="318" class="inS">AI 상담 · 조건 탐색</text>
  <text x="685" y="336" class="inS">제원 비교 · 사실 확인</text>
  <text x="685" y="354" class="inS">RAG 전후 비교</text>

  <!-- ChromaDB (원통) -->
  <path d="M890 72 v120 a130 22 0 0 0 260 0 v-120" fill="#EEF5DC" stroke="#8AA64B" stroke-width="1.5"/>
  <ellipse cx="1020" cy="72" rx="130" ry="22" fill="#F6FAEA" stroke="#8AA64B" stroke-width="1.5"/>
  <text x="1020" y="134" class="t" fill="#4E6420">ChromaDB</text>
  <text x="1020" y="156" class="s" fill="#6E8A33">car_meta 200 · car_docs 3,047</text>
  <path d="M810 150 H888" class="line" marker-end="url(#arr)"/>
  <text x="849" y="140" class="lbl" text-anchor="middle">벡터 검색</text>

  <!-- LLM -->
  <rect x="890" y="248" width="260" height="100" rx="10" fill="#E7F0FC" stroke="#4F7FD0" stroke-width="1.5"/>
  <text x="1020" y="278" class="t" fill="#234E94">LLM · SSAFY GMS</text>
  <text x="1020" y="300" class="s" fill="#3E6BB8">gpt-4o · gpt-4o-mini</text>
  <text x="1020" y="320" class="s" fill="#3E6BB8">Claude Sonnet 4.5</text>
  <text x="1020" y="338" class="s" fill="#3E6BB8">text-embedding-3-small</text>
  <path d="M810 298 H888" class="line" marker-end="url(#arr)"/>
  <text x="849" y="288" class="lbl" text-anchor="middle">프롬프트</text>

  <!-- 위키백과 -->
  <rect x="890" y="420" width="260" height="78" rx="10" fill="#F1F1EF" stroke="#8C8C86" stroke-width="1.5"/>
  <text x="1020" y="450" class="t" fill="#46463F">위키백과 API</text>
  <text x="1020" y="472" class="s" fill="#6A6A62">ko · en · 검색 / 본문</text>
  <path d="M464 400 V440 H888" class="line dash" marker-end="url(#arr)"/>
  <text x="600" y="432" class="lbl">질문마다 새 검색어만 수집</text>

  <!-- 데이터 준비 -->
  <rect x="40" y="330" width="240" height="250" rx="10" fill="#FDF3E3" stroke="#C9902F" stroke-width="1.5"/>
  <text x="160" y="360" class="t" fill="#7A5210">데이터 준비 (1회)</text>
  <text x="160" y="380" class="s" fill="#A9741E">차량 200대 · 1886–2026</text>
  <rect x="58" y="396" width="204" height="38" rx="6" fill="#ffffff" stroke="#E0B970"/>
  <text x="160" y="420" class="s" fill="#7A5210">cars_source.json</text>
  <rect x="58" y="444" width="204" height="38" rx="6" fill="#ffffff" stroke="#E0B970"/>
  <text x="160" y="468" class="s" fill="#7A5210">build_data.py</text>
  <rect x="58" y="492" width="204" height="38" rx="6" fill="#ffffff" stroke="#E0B970"/>
  <text x="160" y="516" class="s" fill="#7A5210">build_index.py</text>
  <text x="160" y="562" class="s" fill="#A9741E">문서 묶음 · 사진 · 제원 대조</text>

  <!-- 데이터 준비 → 백엔드(store) -->
  <path d="M262 511 H312 V321 H360" class="line" marker-end="url(#arr)"/>
  <text x="322" y="470" class="lbl">초기 색인</text>

  <!-- 데이터 준비 → 위키백과·Commons -->
  <path d="M262 463 H296 V604 H1020 V500" class="line dash" marker-end="url(#arr)"/>
  <text x="1004" y="596" class="lbl" text-anchor="end">일괄 요청 · Retry-After · User-Agent 연락처 · 사진은 Wikimedia Commons</text>
</svg>
